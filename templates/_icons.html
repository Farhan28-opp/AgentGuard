{# Simple 1.5px line icons (original, 24px grid). #}
{% macro icon(name, cls="icon") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "arrow" -%}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "mark" -%}<path d="M12 2.8 4.5 5.6v6.1c0 4.5 3.1 8.2 7.5 9.5 4.4-1.3 7.5-5 7.5-9.5V5.6L12 2.8Z"/><path d="M8.5 12.2 11 14.6l4.6-5"/>
{%- elif name == "check" -%}<path d="M5 12.5 10 17 19 7.5"/>
{%- elif name == "key" -%}<circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5M14 9l2 2"/>
{%- elif name == "layers" -%}<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>
{%- elif name == "pulse" -%}<path d="M3 12h4l2.5-6 5 12 2.5-6H21"/>
{%- endif -%}
</svg>
{%- endmacro %}
